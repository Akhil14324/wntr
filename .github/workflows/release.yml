name: Release

# Tag a version (git tag v0.1.0 && git push --tags) to publish a GitHub Release with
# the installer, a portable EXE, SHA-256 checksums and the signed updater manifest.
# Run it by hand (Actions → Release → Run workflow) to just build the EXEs as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Without the signing key the build still works; only updater artifacts are skipped.
      - name: Disable updater artifacts when no signing key is set
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.bundle.createUpdaterArtifacts = $false
          $conf | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json -Encoding utf8

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: WNTR ${{ github.ref_name }}
          releaseBody: |
            **Install:** download `WNTR_*_x64-setup.exe` and run it (no admin needed).
            **Portable:** download `WNTR_*_portable.exe` and run it from anywhere.

            Windows SmartScreen may warn on first run because the EXE is not code-signed: click *More info* → *Run anyway*.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Build only (manual run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: tauri-apps/tauri-action@v0

      - name: Collect EXEs and checksums
        id: collect
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe out/
          Copy-Item src-tauri/target/release/wntr.exe "out/WNTR_${version}_portable.exe"
          Get-ChildItem out -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content out/SHA256SUMS.txt -Encoding ascii
          Get-Content out/SHA256SUMS.txt

      - name: Upload portable EXE and checksums to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          gh release upload "${{ github.ref_name }}" "out/WNTR_${version}_portable.exe" out/SHA256SUMS.txt --clobber

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WNTR-windows
          path: out/
          if-no-files-found: error
