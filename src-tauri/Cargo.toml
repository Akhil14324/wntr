[package]
name = "wntr"
version = "0.1.0"
description = "WNTR - a dynamic notch for Windows"
authors = ["Akhil14324"]
edition = "2024"
license = "MIT"
repository = "https://github.com/Akhil14324/wntr"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "wntr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-process = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json", "query"] }
chrono = { version = "0.4.45", features = ["serde"] }
parking_lot = "0.13.0"
anyhow = "1.0.104"
base64 = "0.23.1"
arboard = "3.7.0"
ical = "0.11.0"
rrule = "0.14.0"
once_cell = "1.21.4"
image = { version = "0.25.10", default-features = false, features = ["png"] }
tokio = { version = "1.54.1", features = ["time", "rt", "sync", "macros"] }
wmi = "0.18.4"
windows-core = "0.62"
windows-collections = "0.3"
chrono-tz = "0.10"

[dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Networking_Connectivity",
  "Devices_Enumeration",
  "Devices_Bluetooth",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tempfile = "3"

# Debug builds link much faster without full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
